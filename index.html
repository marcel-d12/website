  <style>
    :root { --bg: #1c1f23; --paper: #2b3036; --ink: #ece6d8; --ink-soft: #b9b2a3; --accent: #e3a63b; --red: #d8584a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--ink);
      font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .box {
      width: 100%; max-width: 360px; padding: 28px 26px 24px;
      background: var(--paper); transform: rotate(-0.8deg);
      clip-path: polygon(0.5% 2%, 40% 0.4%, 99.4% 1%, 100% 50%, 99.2% 99%, 55% 100%, 0% 99.4%, 0.8% 48%);
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    p { margin: 0 0 18px; color: var(--ink-soft); font-size: 0.95rem; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 0;
      background: #1f2328; color: var(--ink); font-size: 1rem;
    }
    input:focus-visible { outline: 3px solid var(--accent); }
    button {
      border: 0; padding: 10px 22px; background: var(--red); color: var(--ink);
      font-weight: 700; font-size: 1rem; cursor: pointer;
      clip-path: polygon(2% 6%, 98% 0, 100% 92%, 0 100%);
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .err { color: var(--accent); min-height: 1.5em; margin: 10px 0 0; font-size: 0.9rem; }
  </style>

    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

    async function keyFrom(pw) {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }

    async function open(key) {
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
      document.open();
      document.write(new TextDecoder().decode(plain));
      document.close();
    }

    // Innerhalb einer Browser-Sitzung nicht erneut fragen
    (async function () {
      try {
        var saved = sessionStorage.getItem('mh-key');
        if (saved) {
          var key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
          await open(key);
        }
      } catch (e) { try { sessionStorage.removeItem('mh-key'); } catch (_) {} }
    })();

    document.getElementById('gate').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var err = document.getElementById('err');
      err.textContent = '';
      try {
        var key = await keyFrom(document.getElementById('pw').value);
        var raw = await crypto.subtle.exportKey('raw', key);
        await open(key);
        try { sessionStorage.setItem('mh-key', btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (_) {}
      } catch (e) {
        err.textContent = 'Wrong password.';
      }
    });
  </script>
